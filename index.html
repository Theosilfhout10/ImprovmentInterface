<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verbeterregistratie – Egency (prototype)</title>
  <link rel="stylesheet" href="css/stijl.css">
</head>
<body>
  <header class="kop">
    <div class="kop-links">
      <span class="logo" aria-hidden="true">VBR</span>
      <div>
        <h1>Verbeterregistratie</h1>
        <p class="sub">Prototype · Egency</p>
      </div>
    </div>
    <div class="kop-rechts">
      <label class="gebruiker">
        <span>Ingelogd als</span>
        <select id="gebruikerKeuze" aria-label="Kies gebruiker (demo)"></select>
      </label>
      <button id="belKnop" class="bel" type="button" aria-label="Berichten">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
        <span id="belTeller" class="teller" hidden>0</span>
      </button>
    </div>
  </header>

  <nav id="menu" class="menu" aria-label="Hoofdmenu"></nav>

  <main id="inhoud" class="inhoud" tabindex="-1"></main>

  <div id="melding" class="melding" role="status" aria-live="polite" hidden></div>

  <dialog id="detail" class="detail"></dialog>

  <footer class="voet">
    <span>Prototype voor de module Digitale Oplossingen Ontwerpen en Realiseren. Data wordt alleen lokaal in deze browser opgeslagen.</span>
    <span class="voet-knoppen">
      <button type="button" id="exportKnop" class="link">Exporteer data (JSON)</button>
      <button type="button" id="resetKnop" class="link">Demodata herstellen</button>
    </span>
  </footer>

  <script src="js/logica.js"></script>
  <script src="js/demodata.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
