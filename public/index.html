<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Beveiliging: alleen scripts van deze site en verbindingen met Supabase (beperkt de schade van eventuele XSS). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="same-origin">
  <title>Verbeterregistratie Egency</title>
  <link rel="icon" href="img/egency-logo.png">
  <link rel="stylesheet" href="css/stijl.css">
</head>
<body>
  <header class="kop">
    <div class="kop-binnen">
      <div class="merk">
        <img src="img/egency-logo.png" alt="Egency" class="logo" width="82" height="32">
        <span class="app-naam">Verbeterregistratie</span>
      </div>
      <div class="kop-acties">
        <label class="gebruiker" for="gebruikerKeuze">
          <span class="visueel-verborgen">Ingelogd als</span>
          <select id="gebruikerKeuze"></select>
        </label>
        <div id="account" class="account" hidden>
          <span class="account-tekst"><span id="accountNaam" class="account-naam"></span><span id="accountRol" class="rol-chip"></span></span>
          <button type="button" class="tekstknop" data-actie="uitloggen">Uitloggen</button>
        </div>
        <button id="belKnop" class="rond-knop" type="button" aria-label="Berichten">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
          <span id="belTeller" class="teller" hidden>0</span>
        </button>
      </div>
    </div>
    <nav id="menu" class="tabs" aria-label="Hoofdmenu"></nav>
  </header>

  <main id="inhoud" class="inhoud" tabindex="-1">
    <p class="laden">Laden…</p>
  </main>

  <footer class="voet" id="voet"></footer>

  <div id="melding" class="melding" role="status" aria-live="polite" hidden></div>
  <dialog id="venster" class="venster"></dialog>

  <script src="js/logica.js"></script>
  <script src="js/demodata.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
