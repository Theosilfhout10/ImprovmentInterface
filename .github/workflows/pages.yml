# Publiceert de map public/ op GitHub Pages bij elke push naar main.
# GitHub Pages host alleen statische bestanden. Met public/js/config.js ingevuld gebruikt de app
# Supabase (inloggen, gedeelde data, live); anders draait hij als demo in de browser.
# Twee jobs (bouwen, dan publiceren): het artefact is pas betrouwbaar vindbaar als de bouw-job klaar is.
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
